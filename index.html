<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#74726b;--bd:#e4e2da;--ac:#1f7a5c;--inc:#1f7a5c;--exp:#c2410c;--warn:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#211f1d;--tx:#efede6;--mut:#a09d94;--bd:#33312d;--ac:#4cc29a;--inc:#4cc29a;--exp:#fb923c;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#211f1d;--tx:#efede6;--mut:#a09d94;--bd:#33312d;--ac:#4cc29a;--inc:#4cc29a;--exp:#fb923c;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
input,select,button.b{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit}
.seg button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}.seg button.on.i{background:var(--inc);color:#fff;border-color:var(--inc)}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}.bar i.over{background:var(--exp)}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.tx button{border:0;background:none;color:var(--mut);font-size:18px;padding:0 4px}
.tip{padding:9px 11px;border-radius:10px;background:var(--bg);margin-bottom:8px;font-size:14px}
.sm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.sm input{width:110px;padding:6px 8px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mon button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;font-size:16px}
</style>
</head>
<body>
<main>
<h1>💰 Мои финансы</h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="mut" id="st" style="text-align:center;margin-top:8px"></div>
</main>
<script>
var CATS=['Еда','Транспорт','Жильё','Здоровье','Развлечения','Покупки','Подписки','Другое'];
var NEEDS=['Еда','Транспорт','Жильё','Здоровье'];
var INC=['Зарплата','Подработка','Подарок','Другое'];
var S={tx:[],goal:{target:0,saved:0,date:''},budgets:{},cur:'₽'};
var tab='ov',kind='e',mon=new Date().toISOString().slice(0,7),ref=null,store='local';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')+' '+S.cur}
function setSt(t){document.getElementById('st').textContent=t}
async function init(){
  try{var l=localStorage.getItem('fin');if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}
  setSt('Данные сохраняются только в этом браузере');
  render();
}
var tm;function save(){clearTimeout(tm);tm=setTimeout(async function(){
  try{if(ref)await ref.set(JSON.parse(JSON.stringify(S)));else localStorage.setItem('fin',JSON.stringify(S))}catch(e){setSt('Не удалось сохранить')}},400)}
function mtx(m){return S.tx.filter(function(t){return t.d.slice(0,7)===m})}
function sums(m){var i=0,e=0,c={};mtx(m).forEach(function(t){if(t.k==='i')i+=t.a;else{e+=t.a;c[t.c]=(c[t.c]||0)+t.a}});return{i:i,e:e,c:c}}
function prev(m){var d=new Date(m+'-01');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)}
function shift(n){var d=new Date(mon+'-01');d.setMonth(d.getMonth()+n);mon=d.toISOString().slice(0,7);render()}
function mname(m){return new Date(m+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}
function render(){
  var T={ov:'Обзор',op:'Операции',go:'Цели'};
  document.getElementById('tabs').innerHTML=Object.keys(T).map(function(k){return '<button class="'+(tab===k?'on':'')+'" onclick="tab=\''+k+'\';render()">'+T[k]+'</button>'}).join('');
  document.getElementById('view').innerHTML=tab==='ov'?ov():tab==='op'?op():go();
  if(tab==='op')bindOp();
}
function monbar(){return '<div class="mon"><button onclick="shift(-1)">‹</button><b>'+mname(mon)+'</b><button onclick="shift(1)">›</button></div>'}
function ov(){
  var s=sums(mon),bal=s.i-s.e,rate=s.i?Math.round(bal/s.i*100):0;
  var h=monbar()+'<div class="card"><div class="mut">Баланс месяца</div><div class="big '+(bal>=0?'inc':'exp')+'">'+fmt(bal)+'</div>'+
  '<div class="grid" style="margin-top:10px"><div><div class="mut">Доходы</div><b class="inc">'+fmt(s.i)+'</b></div><div><div class="mut">Расходы</div><b class="exp">'+fmt(s.e)+'</b></div></div>'+
  (s.i?'<div class="mut" style="margin-top:8px">Норма сбережений: '+rate+'% (ориентир — 20%)</div>':'')+'</div>';
  var cats=Object.keys(s.c).sort(function(a,b){return s.c[b]-s.c[a]});
  h+='<div class="card"><h2>Расходы по категориям</h2>'+(cats.length?cats.map(function(c){var p=s.e?s.c[c]/s.e*100:0;return '<div class="sm"><span>'+esc(c)+'</span><span>'+fmt(s.c[c])+' · '+Math.round(p)+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div>'}).join(''):'<div class="mut">Пока нет расходов за этот месяц</div>')+'</div>';
  h+='<div class="card"><h2>💡 Советы по оптимизации</h2>'+tips(s).map(function(t){return '<div class="tip">'+t+'</div>'}).join('')+'</div>';
  return h;
}
function tips(s){
  var t=[];
  if(!s.e&&!s.i)return ['Добавьте первые доходы и расходы — и здесь появятся персональные советы.'];
  var need=0,want=0;Object.keys(s.c).forEach(function(c){if(NEEDS.indexOf(c)>-1)need+=s.c[c];else want+=s.c[c]});
  if(s.i){
    var r=(s.i-s.e)/s.i;
    if(r<0)t.push('⚠️ Расходы превышают доходы на '+fmt(s.e-s.i)+'. Начните с самой крупной необязательной категории.');
    else if(r<0.2)t.push('Вы откладываете '+Math.round(r*100)+'% дохода. Чтобы выйти на 20%, нужно сократить траты на '+fmt(s.i*0.2-(s.i-s.e))+'.');
    else t.push('✅ Отлично: вы откладываете '+Math.round(r*100)+'% дохода. Переведите эту сумму на накопления сразу после зарплаты.');
    if(want/s.i>0.3)t.push('Желания (развлечения, покупки, подписки) занимают '+Math.round(want/s.i*100)+'% дохода при ориентире 30%.');
    if(need/s.i>0.5)t.push('Обязательные траты — '+Math.round(need/s.i*100)+'% дохода (ориентир 50%). Проверьте жильё и еду: там чаще всего есть резерв.');
  }
  var p=sums(prev(mon));
  Object.keys(s.c).forEach(function(c){var o=p.c[c]||0;if(o>0&&s.c[c]>o*1.25&&s.c[c]-o>500)t.push('📈 «'+esc(c)+'» выросла на '+Math.round((s.c[c]/o-1)*100)+'% к прошлому месяцу (+'+fmt(s.c[c]-o)+').')});
  Object.keys(S.budgets).forEach(function(c){var b=+S.budgets[c];if(b>0&&(s.c[c]||0)>b)t.push('🚨 Бюджет «'+esc(c)+'» превышен на '+fmt(s.c[c]-b)+'.')});
  var top=Object.keys(s.c).filter(function(c){return NEEDS.indexOf(c)<0}).sort(function(a,b){return s.c[b]-s.c[a]})[0];
  if(top)t.push('Сократив «'+esc(top)+'» на 15%, вы сэкономите '+fmt(s.c[top]*0.15)+' в месяц, это '+fmt(s.c[top]*0.15*12)+' в год.');
  return t.length?t:['Всё выглядит сбалансированно. Продолжайте вести учёт.'];
}
function op(){
  var cs=kind==='e'?CATS:INC;
  var h='<div class="card"><div class="seg" style="margin-bottom:10px"><button class="e '+(kind==='e'?'on':'')+'" onclick="kind=\'e\';render()">− Расход</button><button class="i '+(kind==='i'?'on':'')+'" onclick="kind=\'i\';render()">+ Доход</button></div>'+
  '<div class="row"><input id="a" type="number" inputmode="decimal" placeholder="Сумма"><input id="d" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
  '<div class="row"><select id="c">'+cs.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><input id="n" placeholder="Заметка"></div>'+
  '<button class="b" id="add">Добавить</button></div>'+monbar();
  var l=mtx(mon).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id});
  h+='<div class="card">'+(l.length?l.map(function(t){return '<div class="tx"><div><div>'+esc(t.c)+(t.n?' · <span class="mut">'+esc(t.n)+'</span>':'')+'</div><div class="mut">'+t.d.split('-').reverse().join('.')+'</div></div><div style="white-space:nowrap" class="'+(t.k==='i'?'inc':'exp')+'">'+(t.k==='i'?'+':'−')+fmt(t.a)+' <button onclick="del('+t.id+')">×</button></div></div>'}).join(''):'<div class="mut">Операций за этот месяц нет</div>')+'</div>';
  return h;
}
function bindOp(){document.getElementById('add').onclick=function(){
  var a=parseFloat(document.getElementById('a').value);if(!(a>0)){document.getElementById('a').focus();return}
  var d=document.getElementById('d').value||new Date().toISOString().slice(0,10);
  S.tx.push({id:Date.now(),k:kind,a:a,d:d,c:document.getElementById('c').value,n:document.getElementById('n').value.slice(0,80)});
  mon=d.slice(0,7);save();render()}}
function del(id){S.tx=S.tx.filter(function(t){return t.id!==id});save();render()}
function go(){
  var g=S.goal,left=Math.max(0,g.target-g.saved),pct=g.target?Math.min(100,g.saved/g.target*100):0,adv='';
  if(g.target&&g.date){
    var mo=Math.max(1,Math.ceil((new Date(g.date)-new Date())/2629800000));
    adv=left?'Чтобы успеть к '+g.date.split('-').reverse().join('.')+', откладывайте <b>'+fmt(left/mo)+'</b> в месяц (осталось '+mo+' мес.).':'🎉 Цель достигнута!';
    var s=sums(mon),f=s.i-s.e;if(left&&s.i)adv+=f>=left/mo?' Ваш текущий остаток этого хватает.':' Сейчас свободно '+fmt(Math.max(0,f))+', не хватает '+fmt(left/mo-Math.max(0,f))+' в месяц.';
  }
  var h='<div class="card"><h2>🎯 Цель накопления</h2><div class="row"><input id="gt" type="number" placeholder="Сумма цели" value="'+(g.target||'')+'"><input id="gd" type="date" value="'+g.date+'"></div>'+
  '<div class="row"><input id="gs" type="number" placeholder="Уже накоплено" value="'+(g.saved||'')+'"><button class="b" onclick="saveGoal()">Сохранить</button></div>'+
  (g.target?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">'+fmt(g.saved)+' из '+fmt(g.target)+' ('+Math.round(pct)+'%)</div><div class="tip" style="margin-top:8px">'+adv+'</div>':'')+'</div>';
  var s2=sums(mon);
  h+='<div class="card"><h2>Месячные лимиты</h2>'+CATS.map(function(c){var b=+S.budgets[c]||0,sp=s2.c[c]||0,p=b?Math.min(100,sp/b*100):0;
    return '<div class="sm"><span>'+c+'</span><span><span class="mut">'+fmt(sp)+' /</span> <input type="number" inputmode="numeric" placeholder="лимит" value="'+(b||'')+'" onchange="setB(\''+c+'\',this.value)"></span></div><div class="bar"><i class="'+(b&&sp>b?'over':'')+'" style="width:'+p+'%"></i></div>'}).join('')+'</div>';
  h+='<div class="card"><div class="sm"><span>Валюта</span><input value="'+esc(S.cur)+'" maxlength="4" onchange="S.cur=this.value||\'₽\';save();render()" style="width:70px"></div></div>';
  return h;
}
function saveGoal(){S.goal={target:+document.getElementById('gt').value||0,saved:+document.getElementById('gs').value||0,date:document.getElementById('gd').value};save();render()}
function setB(c,v){S.budgets[c]=+v||0;save();render()}
init();
</script>
</body>
</html>
